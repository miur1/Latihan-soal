<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ruang Latihan Soal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;1,500&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="app">

    <!-- ===== LAYAR 1: PILIH KATEGORI ===== -->
    <section id="layar-pilih" class="layar">
      <header class="kop">
        <span class="kop-label">RUANG LATIHAN</span>
        <h1>Pilih kategori latihan yang mau kamu kerjakan</h1>
      </header>

      <div id="daftar-paket" class="daftar-paket">
        <!-- diisi otomatis oleh app.js dari config KATEGORI -->
      </div>

      <p id="status-muat" class="status-muat"></p>
    </section>

    <!-- ===== LAYAR 2: PILIH PAKET DALAM KATEGORI ===== -->
    <section id="layar-pilih-paket" class="layar tersembunyi">
      <header class="kop">
        <button id="btn-kembali-kategori" class="tautan-kecil" type="button">&larr; Kembali ke kategori</button>
        <span class="kop-label">DAFTAR PAKET</span>
        <h1 id="judul-kategori"></h1>
      </header>

      <div id="daftar-paket-kategori" class="daftar-paket">
        <!-- diisi otomatis oleh app.js -->
      </div>
    </section>

    <!-- ===== LAYAR 2B: PILIH SUB-KATEGORI ===== -->
    <section id="layar-pilih-sub" class="layar tersembunyi">
      <header class="kop">
        <button id="btn-kembali-dari-sub" class="tautan-kecil" type="button">&larr; Kembali ke kategori</button>
        <span class="kop-label">PILIH JENIS</span>
        <h1 id="judul-kategori-sub"></h1>
      </header>

      <div id="daftar-sub" class="daftar-paket">
        <!-- diisi otomatis oleh app.js -->
      </div>
    </section>

    <!-- ===== LAYAR 3: KERJAKAN SOAL ===== -->
    <section id="layar-soal" class="layar tersembunyi">
      <header class="kop-soal">
        <button id="btn-keluar" class="tautan-kecil" type="button">&larr; Ganti paket</button>
        <span id="judul-paket-aktif" class="judul-paket-aktif"></span>
        <span id="nomor-progres" class="nomor-progres"></span>
      </header>

      <div class="garis-progres">
        <div id="isi-progres" class="isi-progres"></div>
      </div>

      <article class="lembar">
        <div class="lembar-kepala">
          <span id="nomor-soal-stempel" class="stempel">SOAL 01</span>
        </div>
        <p id="teks-pertanyaan" class="pertanyaan"></p>
        <div id="daftar-pilihan" class="daftar-pilihan"></div>

        <div id="pembahasan" class="pembahasan tersembunyi">
          <p id="teks-verdict" class="verdict"></p>
          <p id="teks-pembahasan"></p>
        </div>
      </article>

      <div class="aksi-bawah">
        <button id="btn-jawab" class="btn btn-utama" type="button" disabled>Cek jawaban</button>
        <button id="btn-lanjut" class="btn btn-utama tersembunyi" type="button">Soal berikutnya &rarr;</button>
      </div>
    </section>

    <!-- ===== LAYAR 4: HASIL AKHIR ===== -->
    <section id="layar-hasil" class="layar tersembunyi">
      <header class="kop">
        <span class="kop-label">HASIL</span>
        <h1 id="judul-hasil">Selesai!</h1>
      </header>

      <div class="kartu-skor">
        <span id="skor-angka" class="skor-angka">0/0</span>
        <span id="skor-keterangan" class="skor-keterangan">benar</span>
      </div>

      <div id="rekap-list" class="rekap-list"></div>

      <div class="aksi-bawah">
        <button id="btn-ulangi" class="btn btn-utama" type="button">Acak &amp; ulangi paket ini</button>
        <button id="btn-paket-lain" class="btn btn-sekunder" type="button">Pilih paket lain</button>
      </div>
    </section>

    <!-- ===== LAYAR 5: FLASHCARD (Kotoba) ===== -->
    <section id="layar-flashcard" class="layar tersembunyi">
      <header class="kop-soal">
        <button id="btn-keluar-fc" class="tautan-kecil" type="button">&larr; Ganti paket</button>
        <span id="judul-fc" class="judul-paket-aktif"></span>
        <span id="nomor-fc" class="nomor-progres"></span>
      </header>

      <div class="garis-progres">
        <div id="isi-progres-fc" class="isi-progres"></div>
      </div>

      <div class="stat-fc">
        <span class="stat-item stat-hafal-item">✅ Hafal: <strong id="stat-hafal">0</strong></span>
        <span class="stat-item stat-belum-item">❌ Belum: <strong id="stat-belum">0</strong></span>
        <span class="stat-item stat-total-item">📚 <strong id="stat-total">0 / 0</strong></span>
      </div>

      <div id="kartu-fc" class="kartu-fc">
        <div class="kartu-fc-inner">
          <div class="kartu-fc-depan">
            <span id="teks-kanji" class="teks-kanji"></span>
            <span id="teks-baca" class="teks-baca"></span>
          </div>
          <div class="kartu-fc-belakang">
            <span id="teks-arti" class="teks-arti"></span>
          </div>
        </div>
      </div>

      <p class="petunjuk-fc">Ketuk kartu untuk lihat arti</p>

      <div class="aksi-fc">
        <button id="btn-belum-fc" class="btn btn-belum" type="button">✗ Belum</button>
        <button id="btn-hafal-fc" class="btn btn-hafal" type="button">✓ Hafal</button>
      </div>

      <div class="aksi-fc-nav">
        <button id="btn-prev-fc" class="btn btn-nav" type="button">← Sebelumnya</button>
        <button id="btn-next-fc" class="btn btn-nav" type="button">Selanjutnya →</button>
      </div>

      <button id="btn-reset-fc" class="tautan-kecil tautan-reset" type="button">↻ Balik ke awal (reset progress)</button>
    </section>

    <!-- ===== LAYAR 6: HASIL FLASHCARD ===== -->
    <section id="layar-hasil-fc" class="layar tersembunyi">
      <header class="kop">
        <span class="kop-label">HASIL FLASHCARD</span>
        <h1 id="judul-hasil-fc">Selesai!</h1>
      </header>

      <div class="kartu-skor">
        <span id="skor-hafal" class="skor-angka">0</span>
        <span class="skor-keterangan">kartu sudah hafal</span>
      </div>

      <p id="ringkasan-fc" class="ringkasan-fc"></p>

      <div class="aksi-bawah">
        <button id="btn-ulangi-sesi-fc" class="btn btn-utama" type="button">Ulangi yang belum hafal</button>
        <button id="btn-paket-lain-fc" class="btn btn-sekunder" type="button">Pilih paket lain</button>
      </div>
    </section>

    <!-- ===== LAYAR 7: MODUL (PDF Viewer pakai PDF.js) ===== -->
    <section id="layar-modul" class="layar tersembunyi">
      <header class="kop-soal">
        <button id="btn-keluar-modul" class="tautan-kecil" type="button">&larr; Ganti paket</button>
        <span id="judul-modul" class="judul-paket-aktif"></span>
      </header>

      <div class="pdf-wrap">
        <!-- Status loading -->
        <div id="pdf-loading" class="pdf-status tersembunyi">
          <p>⏳ Memuat PDF...</p>
        </div>

        <!-- Status error -->
        <div id="pdf-error" class="pdf-status pdf-error tersembunyi">
          <p>Gagal memuat PDF.</p>
        </div>

        <!-- Canvas tempat PDF di-render -->
        <canvas id="pdf-canvas" class="pdf-canvas tersembunyi"></canvas>
      </div>

      <!-- Kontrol navigasi + zoom + fullscreen -->
      <div id="pdf-kontrol" class="pdf-kontrol tersembunyi">
        <div class="pdf-nav">
          <button id="btn-prev-pdf" class="btn-nav" type="button">← Sebelumnya</button>
          <span id="pdf-nomor" class="pdf-nomor">1 / 1</span>
          <button id="btn-next-pdf" class="btn-nav" type="button">Selanjutnya →</button>
        </div>
        <div class="pdf-zoom">
          <button id="btn-zoom-out" class="btn-nav" type="button">− Zoom</button>
          <button id="btn-fullscreen" class="btn-nav" type="button">⛶ Full Screen</button>
          <button id="btn-zoom-in" class="btn-nav" type="button">+ Zoom</button>
        </div>
      </div>
    </section>

  </div>

<script src="app.js"></script>
<script src="flashcard.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
  // Set worker PDF.js — wajib, biar PDF bisa di-render
  pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
</script>
<script src="modul.js"></script>
</body>
</html>
